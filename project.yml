name: CheerPracticePlayer
options:
  bundleIdPrefix: com.ianrichardson
  deploymentTarget:
    iOS: 18.0
settings:
  base:
    SWIFT_VERSION: 5.0
    GENERATE_INFOPLIST_FILE: YES
configs:
  Debug: debug
  Release: release
targets:
  CheerPracticePlayer:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
      - path: Models
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ianrichardson.CheerPracticePlayer
        PRODUCT_NAME: CheerPracticePlayer
        CURRENT_PROJECT_VERSION: 4
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PracticeMix
        INFOPLIST_KEY_CFBundleName: PracticeMix
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        DEVELOPMENT_TEAM: WC46K49VFA
    scheme:
      testTargets:
        - CheerPracticePlayerTests
  CheerPracticePlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: CheerPracticePlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ianrichardson.CheerPracticePlayerTests
        GENERATE_INFOPLIST_FILE: YES
